<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボタンルーム脱出</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:#eef;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,14,.82);z-index:10}
  .card{background:#171b2b;border:1px solid #2d3555;border-radius:14px;padding:28px 32px;width:min(420px,92vw);box-shadow:0 10px 40px #000a}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:.05em}
  .sub{margin:0 0 18px;color:#9aa4cc;font-size:13px;line-height:1.6}
  select{padding:10px 12px;border-radius:8px;border:1px solid #3a4470;background:#0f1220;color:#fff;font-size:16px}
  label{display:block;font-size:12px;color:#9aa4cc;margin:12px 0 4px}
  input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3a4470;background:#0f1220;color:#fff;font-size:16px}
  button.big{margin-top:18px;width:100%;padding:12px;border:0;border-radius:10px;background:#ff5c7a;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
  button.big:hover{background:#ff7a93}
  button.big:disabled{background:#444b6b;cursor:default}
  #menuMsg{color:#ff8a9d;font-size:13px;min-height:18px;margin-top:10px}
  #plist{list-style:none;padding:0;margin:10px 0}
  #plist li{padding:8px 10px;margin:4px 0;background:#0f1220;border-radius:8px;display:flex;align-items:center;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .code{font-size:30px;letter-spacing:.3em;text-align:center;background:#0f1220;border-radius:8px;padding:8px;margin:6px 0}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
  #cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;opacity:.8;box-shadow:0 0 0 2px #0008}
  #prompt{position:absolute;left:50%;top:56%;transform:translateX(-50%);background:#000a;padding:6px 14px;border-radius:20px;font-size:15px;display:none}
  #timer{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:700;background:#000a;padding:4px 18px;border-radius:10px;font-variant-numeric:tabular-nums}
  #timer.low{color:#ff5c5c}
  #left{position:absolute;top:14px;left:14px;width:300px}
  #log div{background:#000a;margin-bottom:4px;padding:5px 9px;border-radius:6px;font-size:13px;line-height:1.4}
  #right{position:absolute;top:14px;right:14px;width:260px}
  #right .box{background:#000b;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
  #right h3{margin:0 0 4px;font-size:12px;color:#ffd75e}
  #hints div{margin:3px 0;line-height:1.4}
  #toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);max-width:80vw;text-align:center;font-size:22px;font-weight:700;background:#000c;padding:12px 22px;border-radius:12px;opacity:0;transition:opacity .3s}
  #toast.show{opacity:1}
  #status{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);font-size:34px;font-weight:700;text-shadow:0 2px 10px #000}
  #dark{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s;z-index:4}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
  #errbar{position:fixed;left:0;right:0;bottom:0;background:#a00;color:#fff;font-size:12px;padding:6px 10px;z-index:99;display:none;white-space:pre-wrap}
  .fx-rainbow{animation:hue 1.6s linear infinite}
  .fx-negative{filter:invert(1)}
  .fx-blur{filter:blur(6px)}
  @keyframes hue{from{filter:hue-rotate(0deg) saturate(2)}to{filter:hue-rotate(360deg) saturate(2)}}
  #lock{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;background:rgba(0,0,0,.55);font-size:22px;cursor:pointer;text-align:center;line-height:1.8}
  #end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:rgba(0,0,0,.7);text-align:center}
  #end h2{font-size:38px;margin:0 0 8px}
  kbd{background:#2a3050;border-radius:4px;padding:1px 6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dark"></div>
<div id="flash"></div>
<div id="errbar"></div>

<!-- メニュー -->
<div class="panel" id="menu">
  <div class="card">
    <h1>🔘 ボタンルーム脱出</h1>
    <p class="sub">壁一面のボタン。正しい出口ボタンはたった1つ。<br>最大5人で、誰が先に脱出できるか勝負!</p>
    <label>名前</label><input id="name" maxlength="12" placeholder="なまえ">
    <label>ルームコード(空欄で新規作成)</label><input id="room" maxlength="6" placeholder="例: AB3D">
    <button class="big" id="joinBtn">入室する</button>
    <div id="menuMsg"></div>
  </div>
</div>

<!-- ロビー -->
<div class="panel" id="lobby" style="display:none">
  <div class="card">
    <h1>ロビー</h1>
    <p class="sub">このコードを友達に伝えてください</p>
    <div class="code" id="lobbyCode">----</div>
    <ul id="plist"></ul>
    <div id="sizeBox">
      <label>ボタンの数(ホストが選択)</label>
      <select id="size">
        <option value="s">小:32個</option>
        <option value="m">中:72個</option>
        <option value="l">大:128個</option>
        <option value="xl">特大:200個</option>
      </select>
    </div>
    <button class="big" id="startBtn">ゲーム開始</button>
    <p class="sub" id="waitMsg" style="margin-top:12px;text-align:center"></p>
    <p class="sub"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 / <kbd>Space</kbd> ジャンプ(空中で連打すると高く登れる) / マウス 視点 / クリック ボタンを押す</p>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="timer">5:00</div>
  <div id="left"><div id="log"></div></div>
  <div id="right">
    <div class="box"><h3>プレイヤー</h3><div id="hudPlayers"></div></div>
    <div class="box"><h3>💡 ヒント</h3><div id="hints">まだありません</div></div>
  </div>
  <div id="toast"></div>
  <div id="status"></div>
</div>
<div id="lock">クリックしてゲーム開始 / 再開<br><small>(ESCでマウス解除)</small></div>
<div id="end"><div class="card"><h2 id="endTitle"></h2><p class="sub" id="endSub"></p><button class="big" id="againBtn">もう一度遊ぶ</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('error', e => {
  const b = document.getElementById('errbar'); if (!b) return;
  b.style.display = 'block'; b.textContent = 'エラー: ' + e.message + ' (' + (e.lineno || '?') + ')';
});
const $ = id => document.getElementById(id);
const SY = 2.3;   // ボタンの縦間隔
const WALL_NAMES = ['北', '東', '南', '西'];
const SLOT_COLORS = ['#ff5252', '#40c4ff', '#69f0ae', '#ffd740', '#e040fb'];
const MARK = { exit: '🚪', hint: '💡', freeze: '❄', dark: '🌑', warp: '🌀', none: '・' };

// ---------- 状態 ----------
let ws = null, myId = null, hostId = null, phase = 'menu';
let lobbyPlayers = [];
let locked = false;
let frozenUntil = 0, darkUntil = 0, endAt = 0;
let jumpY = 0, vy = 0, jumpReq = false;   // ジャンプ
let fxs = {};          // 効果名 -> {until, v, label}
let shield = false, flashUntil = 0;
const fxOn = (k, t = Date.now()) => fxs[k] && fxs[k].until > t ? fxs[k] : null;
const keys = {};
let yaw = 0, pitch = 0;
const me = { x: 0, z: 0 };
const avatars = new Map();   // id -> {g, tx, tz, try}

// ---------- three.js 基本 ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d14);
scene.fog = new THREE.FogExp2(0x0b0d14, 0);
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.7, 0);
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

scene.add(new THREE.AmbientLight(0x9098b8, 0.75));

// ---------- 部屋とボタン (ボタン数に応じて作り直す) ----------
function floorTexture(half) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    g.fillStyle = (x + y) % 2 ? '#2a2f45' : '#20243a'; g.fillRect(x * 32, y * 32, 32, 32);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(half / 2, half / 2);
  return t;
}
function textTexture(text, w, h, font, color = '#fff', bg = null) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.fillStyle = color; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2 + 4);
  const t = new THREE.CanvasTexture(c); return { t, c, g };
}
const WALL_N = [[0, 0, 1], [-1, 0, 0], [0, 0, -1], [1, 0, 0]];   // 各壁の内向き法線
const WALL_ROT = [0, -Math.PI / 2, Math.PI, Math.PI / 2];
const wallMat = c => new THREE.MeshStandardMaterial({ color: c, side: THREE.BackSide, roughness: .9 });

let level = { cols: 4, rows: 2, per: 8, n: 32, half: 10, H: 6, sx: 4 };
let levelGroup = null;
let btns = [], btnMeshes = [];

function buildLevel(cols, rows, half, sx) {
  if (levelGroup) {
    scene.remove(levelGroup);
    levelGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(mt => {
          if (mt.map && typeof mt.map.dispose === 'function') mt.map.dispose();
          if (typeof mt.dispose === 'function') mt.dispose();
        });
      }
    });
  }
  const per = cols * rows, n = per * 4;
  const H = Math.max(6, 1.7 + (rows - 1) * SY + 2.8);
  level = { cols, rows, per, n, half, H, sx };
  levelGroup = new THREE.Group();
  btns = []; btnMeshes = [];

  // 部屋 (BoxGeometry面順: +x東, -x西, +y天井, -y床, +z南, -z北)
  const mats = [
    wallMat(0x4a3a5c), wallMat(0x3a5c4a), wallMat(0x1c2030),
    new THREE.MeshStandardMaterial({ map: floorTexture(half), side: THREE.BackSide }),
    wallMat(0x5c4a3a), wallMat(0x3a4a5c),
  ];
  const room = new THREE.Mesh(new THREE.BoxGeometry(half * 2, H, half * 2), mats);
  room.position.y = H / 2; levelGroup.add(room);

  // ライト
  const lamp = new THREE.PointLight(0xfff2dd, 0.9, half * 4); lamp.position.set(0, H - 0.5, 0); levelGroup.add(lamp);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => {
    const l = new THREE.PointLight(0xaabbff, 0.4, half * 2);
    l.position.set(a * half * 0.7, H / 2, b * half * 0.7); levelGroup.add(l);
  });

  // 壁の方角プレート
  for (let w = 0; w < 4; w++) {
    const nrm = WALL_N[w];
    const { t } = textTexture(WALL_NAMES[w], 256, 256, 'bold 190px sans-serif', '#ffffffcc');
    const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6),
      new THREE.MeshBasicMaterial({ map: t, transparent: true }));
    m.position.set(-nrm[0] * (half - 0.02), H - 0.9, -nrm[2] * (half - 0.02));
    m.rotation.y = WALL_ROT[w];
    levelGroup.add(m);
  }

  // ボタン
  for (let i = 0; i < n; i++) {
    const w = Math.floor(i / per), k = i % per, c = k % cols, r = Math.floor(k / cols);
    const nrm = WALL_N[w];
    const g = new THREE.Group();
    g.position.set(-nrm[0] * half, 0, -nrm[2] * half);
    g.rotation.y = WALL_ROT[w];
    g.translateX((c - (cols - 1) / 2) * sx);    // 壁を正面から見て左→右
    g.position.y = 1.7 + r * SY;

    const plate = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 0.15),
      new THREE.MeshStandardMaterial({ color: 0x15171f, roughness: .5, metalness: .4 }));
    plate.position.z = 0.075; g.add(plate);

    const col = new THREE.Color().setHSL(((i * 37) % 360) / 360, 0.85, 0.5);
    const cg = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 24); cg.rotateX(Math.PI / 2);
    const bm = new THREE.Mesh(cg, new THREE.MeshStandardMaterial({
      color: col, emissive: col, emissiveIntensity: 0.35, roughness: .3 }));
    bm.position.z = 0.3; bm.userData.id = i; g.add(bm);

    const lab = textTexture(String(i + 1), 256, 100, 'bold 60px sans-serif', '#fff', '#111');
    const lm = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.43), new THREE.MeshBasicMaterial({ map: lab.t }));
    lm.position.set(0, -1.05, 0.02); g.add(lm);

    levelGroup.add(g);
    btns.push({ i, mesh: bm, lab, color: col, pressed: false });
    btnMeshes.push(bm);
  }
  scene.add(levelGroup);
}
function drawLabel(b, mark) {
  const { g, c, t } = b.lab;
  g.fillStyle = '#111'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#fff'; g.font = 'bold 60px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(mark ? `${b.i + 1} ${mark}` : String(b.i + 1), c.width / 2, c.height / 2 + 4);
  t.needsUpdate = true;
}
function pressVisual(id, mark, isExit) {
  const b = btns[id]; if (!b) return; b.pressed = true;
  b.mesh.scale.z = 0.4; b.mesh.position.z = 0.21;
  if (isExit) { b.mesh.material.color.set(0x44ff88); b.mesh.material.emissive.set(0x22ff66); b.mesh.material.emissiveIntensity = 1.2; }
  else { b.mesh.material.color.set(0x555a66); b.mesh.material.emissive.set(0x000000); }
  drawLabel(b, mark);
}
buildLevel(4, 2, 10, 4);

// ---------- アバター ----------
function makeAvatar(name, slot) {
  const col = SLOT_COLORS[slot % 5];
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: col, roughness: .6 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.38, 1.1, 14), m); body.position.y = 0.65; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), m); head.position.y = 1.42; g.add(head);
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.1, 0.18), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  nose.position.set(0, 1.45, -0.3); g.add(nose);
  const lab = textTexture(name, 512, 96, 'bold 52px sans-serif', col, '#000a');
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: lab.t, depthTest: false }));
  sp.scale.set(1.6, 0.3, 1); sp.position.y = 2.0; sp.renderOrder = 10; g.add(sp);
  scene.add(g);
  return g;
}
function syncAvatars() {
  const ids = new Set(lobbyPlayers.map(p => p.id));
  for (const [id, a] of avatars) if (!ids.has(id)) { scene.remove(a.g); avatars.delete(id); }
  lobbyPlayers.forEach(p => {
    if (p.id === myId || avatars.has(p.id)) return;
    avatars.set(p.id, { g: makeAvatar(p.name, p.slot), tx: 0, ty: 0, tz: 0, try: 0 });
  });
  const vis = phase === 'playing' || phase === 'ended';
  avatars.forEach(a => a.g.visible = vis);
}

// ---------- 通信 ----------
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
function connect() {
  const name = $('name').value.trim(), room = $('room').value.trim();
  $('menuMsg').textContent = '接続中…';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => send({ t: 'join', name, room });
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (phase !== 'menu') backToMenu('接続が切れました'); else $('menuMsg').textContent = '接続できませんでした'; };
}
function backToMenu(msg) {
  phase = 'menu'; myId = null;
  document.exitPointerLock && document.exitPointerLock();
  ['lobby', 'hud', 'lock', 'end'].forEach(id => $(id).style.display = 'none');
  $('menu').style.display = 'flex'; $('menuMsg').textContent = msg || '';
  avatars.forEach(a => scene.remove(a.g)); avatars.clear();
}

function handle(m) {
  switch (m.t) {
    case 'error': $('menuMsg').textContent = m.msg; ws.onclose = null; ws.close(); break;
    case 'joined': myId = m.id; break;
    case 'lobby': onLobby(m); break;
    case 'start': onStart(m); break;
    case 'players':
      m.list.forEach(p => { const a = avatars.get(p.id); if (a) { a.tx = p.x; a.ty = p.y || 0; a.tz = p.z; a.try = p.ry; } });
      break;
    case 'pressed': onPressed(m); break;
    case 'left': log(`${m.name} が退室した`); break;
    case 'end': onEnd(m); break;
  }
}

function onLobby(m) {
  lobbyPlayers = m.players; hostId = m.host;
  if (phase === 'menu' || phase === 'ended' || phase === 'lobby') {
    phase = 'lobby';
    document.exitPointerLock && document.exitPointerLock();
    ['menu', 'hud', 'lock', 'end'].forEach(id => $(id).style.display = 'none');
    $('lobby').style.display = 'flex';
    $('lobbyCode').textContent = m.room;
    const ul = $('plist'); ul.innerHTML = '';
    m.players.forEach(p => {
      const li = document.createElement('li');
      const d = document.createElement('span'); d.className = 'dot'; d.style.background = SLOT_COLORS[p.slot % 5];
      const s = document.createElement('span'); s.textContent = p.name + (p.id === myId ? ' (あなた)' : '') + (p.id === hostId ? ' 👑' : '');
      li.append(d, s); ul.appendChild(li);
    });
    const isHost = myId === hostId;
    $('startBtn').style.display = isHost ? 'block' : 'none';
    $('sizeBox').style.display = isHost ? 'block' : 'none';
    $('waitMsg').textContent = isHost ? `${m.players.length}/5人 参加中` : 'ホストの開始を待っています…';
  }
  syncAvatars();
  renderHudPlayers();
}

function renderHudPlayers() {
  const box = $('hudPlayers'); box.innerHTML = '';
  lobbyPlayers.forEach(p => {
    const d = document.createElement('div');
    d.style.color = SLOT_COLORS[p.slot % 5];
    d.textContent = '● ' + p.name + (p.id === myId ? ' (you)' : '');
    box.appendChild(d);
  });
}

function onStart(m) {
  phase = 'playing';
  buildLevel(m.cols, m.rows, m.half, m.sx);
  const s = m.spawns[myId] || [0, 0];
  me.x = s[0]; me.z = s[1]; yaw = 0; pitch = 0;
  frozenUntil = 0; darkUntil = 0; fxs = {}; shield = false; flashUntil = 0; jumpY = 0; vy = 0; jumpReq = false;
  $('dark').style.opacity = 0; $('flash').style.opacity = 0; $('status').textContent = ''; $('c').className = '';
  endAt = Date.now() + m.remain;
  $('log').innerHTML = ''; $('hints').textContent = 'まだありません';
  $('lobby').style.display = 'none'; $('end').style.display = 'none';
  $('hud').style.display = 'block'; $('lock').style.display = 'flex';
  syncAvatars(); renderHudPlayers();
  avatars.forEach((a, id) => { const sp = m.spawns[id]; if (sp) { a.tx = sp[0]; a.tz = sp[1]; a.g.position.set(sp[0], 0, sp[1]); } });
  toast('出口ボタンはたった1つ! 先に押した人の勝ち', 3500);
}

let firstHint = true;
function addHint(text, cls) {
  if (firstHint) { $('hints').innerHTML = ''; firstHint = false; }
  const d = document.createElement('div'); d.textContent = text; if (cls) d.style.color = cls;
  $('hints').appendChild(d);
}
function applyFx(f) {
  const t = Date.now();
  switch (f.k) {
    case 'freeze': frozenUntil = t + f.d; break;
    case 'dark': darkUntil = t + f.d; $('dark').style.opacity = 0.97; break;
    case 'tp': me.x = f.x; me.z = f.z; break;
    case 'flash': flashUntil = t + f.d; $('flash').style.transition = 'none'; $('flash').style.opacity = 1; break;
    case 'shield': shield = true; break;
    case 'shieldbreak': shield = false; toast('🛡 バリアが悪い効果を防いだ!', 2500); break;
    case 'note': addHint(f.text, '#8be9fd'); toast(f.text, 5000); break;
    default: fxs[f.k] = { until: t + (f.d || 0), v: f.v, label: f.label };
  }
}
function onPressed(m) {
  const isExit = m.type === 'exit';
  pressVisual(m.id, m.mark || '', isExit);
  (m.auto || []).forEach(i => pressVisual(i, '🧹', false));
  beep(isExit ? 880 : m.type === 'none' ? 220 : 440, 0.15);
  const who = m.by === myId ? 'あなた' : m.name;
  log(`${who}:${m.id + 1}番 → ${m.mark} ${m.type === 'hint' ? 'ヒント' : m.text}`);

  const hs = m.hints || [];
  hs.forEach(h => addHint(h.unsure ? `・❓${h.text}(${m.id + 1}番・真偽不明)` : `・${h.text}(${m.id + 1}番)`, h.unsure ? '#ffb86c' : null));
  if (hs.length) toast(hs.map(h => (h.unsure ? '🤡❓ ' : '💡 ') + h.text).join('\n'), 5000);
  else toast(`${m.mark} ${m.text}`, m.by === myId ? 3500 : 2500);

  if (m.time != null) endAt = Date.now() + m.time;
  ((m.fx || {})[myId] || []).forEach(applyFx);
}
// 新規ゲームでヒント欄初期化
const _onStart = onStart; onStart = function (m) { firstHint = true; _onStart(m); };

function onEnd(m) {
  phase = 'ended';
  document.exitPointerLock && document.exitPointerLock();
  $('lock').style.display = 'none';
  if (m.exitId >= 0 && btns[m.exitId] && !btns[m.exitId].pressed) pressVisual(m.exitId, MARK.exit, true);
  const win = m.winner;
  if (win) {
    $('endTitle').textContent = win.id === myId ? '🎉 脱出成功!!' : `🚪 ${win.name} が脱出!`;
    $('endSub').textContent = `出口は ${WALL_NAMES[Math.floor(m.exitId / level.per)]}の壁の ${m.exitId + 1}番 でした`;
  } else {
    $('endTitle').textContent = '⏰ 時間切れ… 全員ゲームオーバー';
    $('endSub').textContent = `出口は ${WALL_NAMES[Math.floor(m.exitId / level.per)]}の壁の ${m.exitId + 1}番 でした`;
  }
  $('againBtn').style.display = myId === hostId ? 'block' : 'none';
  if (myId !== hostId) $('endSub').textContent += '\nホストが次のゲームを始めるのを待っています…';
  $('end').style.display = 'flex';
}

// ---------- UI ----------
function log(t) {
  const d = document.createElement('div'); d.textContent = t; $('log').appendChild(d);
  while ($('log').children.length > 7) $('log').removeChild($('log').firstChild);
}
let toastTimer = null;
function toast(t, ms = 2500) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}
let actx = null;
function beep(f, d) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; o.type = 'square'; g.gain.value = 0.05;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

$('joinBtn').onclick = connect;
$('name').addEventListener('keydown', e => e.key === 'Enter' && connect());
$('room').addEventListener('keydown', e => e.key === 'Enter' && connect());
$('startBtn').onclick = () => send({ t: 'start', size: $('size').value });
$('againBtn').onclick = () => send({ t: 'again' });
$('lock').onclick = () => $('c').requestPointerLock();
$('c').onclick = () => { if (phase === 'playing' && !locked) $('c').requestPointerLock(); };

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === $('c');
  if (phase === 'playing') $('lock').style.display = locked ? 'none' : 'flex';
});
addEventListener('mousemove', e => {
  if (!locked) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.45, Math.min(1.45, pitch - e.movementY * 0.0022));
});
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (phase === 'playing' && locked && !e.repeat && Date.now() >= frozenUntil) jumpReq = true;
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ボタン押下
const ray = new THREE.Raycaster();
function lookedButton() {
  ray.setFromCamera({ x: 0, y: 0 }, camera);
  const hit = ray.intersectObjects(btnMeshes)[0];
  if (hit && hit.distance < 6.5) return hit.object.userData.id;
  return -1;
}
addEventListener('mousedown', e => {
  if (!locked || phase !== 'playing' || e.button !== 0) return;
  if (Date.now() < frozenUntil || Date.now() < darkUntil && false) return;
  const id = lookedButton();
  if (id >= 0 && !btns[id].pressed) send({ t: 'press', id });
});

// ---------- メインループ ----------
let last = performance.now(), sendAcc = 0, eyeY = 1.7, fovNow = 75;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = Date.now();

  if (phase === 'playing') {
    const frozen = t < frozenUntil;
    // ジャンプ: スペースで跳ぶ。空中でもう一度押すと連続ジャンプできるので、高いボタンへは跳び上がって届く
    if (jumpReq) { jumpReq = false; if (locked && !frozen) vy = 7.5; }
    vy -= 16 * dt;
    jumpY += vy * dt;
    if (jumpY <= 0) { jumpY = 0; vy = 0; }
    const maxJump = Math.max(0, level.H - 2.0);
    if (jumpY > maxJump) { jumpY = maxJump; if (vy > 0) vy = 0; }
    if (locked && !frozen) {
      const inv = fxOn('invert', t) ? -1 : 1;
      const f = ((keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0)) * inv;
      const s = ((keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0)) * inv;
      if (f || s) {
        const sf = fxOn('speed', t), mul = sf ? sf.v : 1;
        const len = Math.hypot(f, s), sp = (keys.ShiftLeft ? 8 : 5) * mul * dt;
        me.x += (-Math.sin(yaw) * f + Math.cos(yaw) * s) / len * sp;
        me.z += (-Math.cos(yaw) * f - Math.sin(yaw) * s) / len * sp;
        const lim = level.half - 0.6;
        me.x = Math.max(-lim, Math.min(lim, me.x));
        me.z = Math.max(-lim, Math.min(lim, me.z));
      }
    }
    // 状態表示
    const tags = [];
    if (shield) tags.push('🛡バリア');
    if (frozen) tags.push(`❄凍結 ${Math.ceil((frozenUntil - t) / 1000)}`);
    if (t < darkUntil) tags.push(`🌑暗闇 ${Math.ceil((darkUntil - t) / 1000)}`);
    else if ($('dark').style.opacity !== '0') $('dark').style.opacity = 0;
    for (const k in fxs) { const e = fxOn(k, t); if (e && e.label) tags.push(`${e.label} ${Math.ceil((e.until - t) / 1000)}`); }
    $('status').textContent = tags.join('   ');

    // 画面効果 (フィルタ / フラッシュ / 回転)
    const flt = fxOn('filter', t);
    const cls = flt ? 'fx-' + flt.v : '';
    if ($('c').className !== cls) $('c').className = cls;
    if (flashUntil) {
      if (t >= flashUntil) { flashUntil = 0; $('flash').style.opacity = 0; }
      else { $('flash').style.transition = 'opacity .2s'; $('flash').style.opacity = Math.min(1, (flashUntil - t) / 2000); }
    }
    if (fxOn('spin', t)) yaw += 2.4 * dt;

    // タイマー
    const rem = Math.max(0, endAt - t), sec = Math.ceil(rem / 1000);
    $('timer').textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    $('timer').classList.toggle('low', sec <= 30);

    // 狙っているボタン
    const id = locked ? lookedButton() : -1;
    const pr = $('prompt');
    if (id >= 0) {
      pr.style.display = 'block';
      pr.textContent = btns[id].pressed ? `${id + 1}番(押し済み)` : `クリックで ${id + 1}番 を押す`;
    } else pr.style.display = 'none';

    // 位置送信
    sendAcc += dt;
    if (sendAcc > 0.066) { sendAcc = 0; send({ t: 'move', x: me.x, y: jumpY, z: me.z, ry: yaw }); }
  }

  // カメラ (高さ / 視野 / 揺れ / 霧)
  const tNow = Date.now();
  const eye = fxOn('eye', tNow), fv = fxOn('fov', tNow);
  eyeY += ((eye ? eye.v : 1.7) - eyeY) * Math.min(1, dt * 5);
  fovNow += ((fv ? fv.v : 75) - fovNow) * Math.min(1, dt * 5);
  if (Math.abs(camera.fov - fovNow) > 0.05) { camera.fov = fovNow; camera.updateProjectionMatrix(); }
  const sh = fxOn('shake', tNow) ? 0.07 : 0;
  camera.position.set(me.x + (Math.random() - .5) * sh, Math.min(level.H - 0.3, eyeY + jumpY) + (Math.random() - .5) * sh, me.z + (Math.random() - .5) * sh);
  camera.rotation.set(pitch + (Math.random() - .5) * sh * 0.4, yaw + (Math.random() - .5) * sh * 0.4, 0);
  const fogOn = fxOn('fog', tNow);
  scene.fog.density += ((fogOn ? 0.16 : 0) - scene.fog.density) * Math.min(1, dt * 4);

  avatars.forEach(a => {
    a.g.position.x += (a.tx - a.g.position.x) * Math.min(1, dt * 12);
    a.g.position.z += (a.tz - a.g.position.z) * Math.min(1, dt * 12);
    a.g.position.y += (a.ty - a.g.position.y) * Math.min(1, dt * 12);
    a.g.rotation.y = a.try;
  });

  // 出口ボタンの脈動(終了後)
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);
</script>
</body>
